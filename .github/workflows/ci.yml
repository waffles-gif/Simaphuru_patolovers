name: Python · pruebas y calidad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Experimento Qiskit de referencia
        run: python -m quantum.run_qaoa --input data/model_output.json --out artifacts/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: experimento-python-${{ matrix.python-version }}
          path: artifacts/ci.json
